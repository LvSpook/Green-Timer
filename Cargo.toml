[package]
name = "green-timer"
version = "1.3.3"
edition = "2021"
rust-version = "1.80"
description = "A lightweight, always-on-top timer overlay for Windows"
license = "MIT"
authors = ["Luke V"]
build = "build.rs"

[build-dependencies]
# Embeds the icon and version info into the exe itself, so the standalone
# download is not icon-less.
embed-resource = "3.0"

[[bin]]
name = "GreenTimer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico"] }
log = "0.4"
env_logger = "0.11"
tray-icon = "0.19"
muda = "0.15"
ureq = { version = "2", features = ["json", "tls"] }
font-kit = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_Media_Audio",
] }
raw-window-handle = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
